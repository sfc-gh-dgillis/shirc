version: '3'

tasks:

  create-external-volume:
    desc: Creates a Snowflake external volume using the Snow CLI.
    vars:
      SQL_FILE: '{{.SQL_FILE | default "sql/infra-up-external/001-create_external_volume.sql"}}'
    cmds:
      - cmd/create-external-volume.sh "{{.SQL_FILE}}"

  drop-external-volume:
    desc: Drops a Snowflake external volume.
    cmds:
      - cmd/drop-external-volume.sh "{{.EXTERNAL_VOLUME_NAME}}"
  desc-external-volume:
    desc: Describes a Snowflake external volume and outputs storage location JSON.
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "../../output"}}'
    cmds:
      - cmd/desc-external-volume.sh "{{.EXTERNAL_VOLUME_NAME}}" "{{.OUTPUT_DIR}}"

  run-init:
    desc: Runs unified Snowflake initialization script (conditionally handles managed/external storage).
    vars:
      SQL_DIR: '{{.SQL_DIR | default "sql"}}'
    cmds:
      - cmd/run-init.sh "{{.SQL_DIR}}"

  upload-files-to-internal-named-stage:
    desc: Uploads all files from the given directory to a Snowflake Internal stage using the Snowflake CLI and PUT command.
    vars:
      FILE_UPLOAD_DIR: '{{.FILE_UPLOAD_DIR | default "../../upload"}}'
      INTERNAL_NAMED_STAGE: '{{.INTERNAL_NAMED_STAGE | default "@json_stage"}}'
    cmds:
      - python3 pyutil/snowcliput/snowcliput.py "{{.FILE_UPLOAD_DIR}}" "{{.CLI_CONNECTION_NAME}}" "{{.INTERNAL_NAMED_STAGE}}"

  run-ddl:
    desc: Runs a SQL batch file with Jinja templating (engineer role context).
    cmds:
      - cmd/run-ddl.sh "{{.SQL_FILE}}"

  create-tables:
    desc: Creates standalone Iceberg V3 feature-showcase tables (batch-2/001-create-tables.sql).
    vars:
      SQL_FILE: '{{.SQL_FILE | default "sql/batch-2/001-create-tables.sql"}}'
    cmds:
      - task: run-ddl
        vars: {SQL_FILE: "{{.SQL_FILE}}"}

  load-data:
    desc: Loads staged JSON data into batch-2 Iceberg V3 tables (batch-2/002-load-data.sql).
    vars:
      SQL_FILE: '{{.SQL_FILE | default "sql/batch-2/002-load-data.sql"}}'
    cmds:
      - task: run-ddl
        vars: {SQL_FILE: "{{.SQL_FILE}}"}

  run-dml-demo:
    desc: Runs DML demo showing deletion vectors and row lineage (batch-2/003-dml-demo.sql).
    vars:
      SQL_FILE: '{{.SQL_FILE | default "sql/batch-2/003-dml-demo.sql"}}'
    cmds:
      - task: run-ddl
        vars: {SQL_FILE: "{{.SQL_FILE}}"}

  drop-tables:
    desc: Drops Iceberg V3 demo tables (batch-2/teardown.sql).
    vars:
      SQL_FILE: '{{.SQL_FILE | default "sql/batch-2/teardown.sql"}}'
    cmds:
      - task: run-ddl
        vars: {SQL_FILE: "{{.SQL_FILE}}"}

  drop-database-if-exists:
    desc: Drops the specified Snowflake database if it exists using the Snowflake CLI.
    cmds:
      - snow sql --connection "{{.CLI_CONNECTION_NAME}}" --query "DROP DATABASE IF EXISTS {{.DEMO_DATABASE_NAME}};"

  generate-notebook:
    desc: Generates a Snowflake notebook from template by substituting environment variables.
    vars:
      TEMPLATE_FILE: '{{.TEMPLATE_FILE | default "notebook/iceberg_v3_template.ipynb"}}'
      OUTPUT_FILE: '{{.OUTPUT_FILE | default "notebook/iceberg_v3_notebook/iceberg_v3_demo_notebook.ipynb"}}'
    cmds:
      - cmd/generate-notebook.sh "{{.TEMPLATE_FILE}}" "{{.OUTPUT_FILE}}"

  deploy-notebook:
    desc: Deploys a notebook to Snowflake using the Snow CLI.
    vars:
      PROJECT_DIR: '{{.PROJECT_DIR | default "notebook/iceberg_v3_notebook"}}'
    cmds:
      - cmd/deploy-notebook.sh "{{.PROJECT_DIR}}"

  stream-telemetry:
    desc: Streams simulated vehicle telemetry into Iceberg V3 table via Snowpipe Streaming SDK.
    vars:
      EVENT_COUNT: '{{.EVENT_COUNT | default "100"}}'
    cmds:
      - python3 pyutil/snowpipe_streaming/stream_telemetry.py --events {{.EVENT_COUNT}}
