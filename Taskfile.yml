version: '3'

includes:
  validate-prerequisites: ./tasks/validate-prerequisites/validate-prerequisite-tasks.yml
  aws-cli: ./tasks/aws-cli/awscli-tasks.yml
  snow-cli:
    taskfile: ./tasks/snow-cli/snowcli-tasks.yml
    dir: ./tasks/snow-cli

env:
  ENV_DIR: .env
  TEMP_DIR: tmp

dotenv: ['{{ .ENV_DIR }}/{{ .DOTENV_FILENAME | default "iceberg.env" }}']

tasks:

  demo-up:
    desc: Sets up infrastructure and deploys Snowflake notebook for Iceberg demo.
    cmds:
      - task: infrastructure-up
      - task: snow-cli:upload-files-to-internal-named-stage
      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/batch-1
          CLI_KEYPAIR_CONNECTION_NAME: $CLI_KEYPAIR_CONNECTION_NAME
      - task: snow-cli:generate-fleet-notebook
      - task: snow-cli:deploy-notebook

  infrastructure-up:
    desc: Sets up infrastructure for Iceberg demos (routes by STORAGE_MODE).
    internal: true
    cmds:
      - task: infrastructure-up-{{.STORAGE_MODE | default "managed"}}

  infrastructure-up-external:
    desc: Sets up AWS + Snowflake infrastructure (external S3 storage).
    internal: true
    cmds:
      - task: aws-resources-up
      - task: snowflake-external-volume-up
      - task: aws-cli:update-trust-policy-with-snowflake-user
      - task: snow-cli:run-init

  infrastructure-up-managed:
    desc: Sets up Snowflake-only infrastructure (Snowflake Managed Storage).
    internal: true
    cmds:
      - task: validate-prerequisites:snowcli
      - task: snow-cli:run-init

  aws-resources-up:
    desc: Validates AWS CLI, creates S3 bucket, generates and creates IAM policy.
    internal: true
    cmds:
      - task: validate-prerequisites:awscli
      - task: aws-cli:make-s3-bucket
        vars:
          S3_BUCKET_NAME: $S3_BUCKET_NAME
          AWS_REGION: $AWS_REGION
      - task: aws-cli:generate-iam-policy-for-s3-bucket-access
        vars:
          S3_BUCKET_NAME: $S3_BUCKET_NAME
          S3_PREFIX: $S3_PREFIX
      - task: aws-cli:create-iam-policy
        vars:
          IAM_POLICY_NAME: $IAM_POLICY_NAME
      - task: aws-cli:generate-trust-policy
      - task: aws-cli:create-iam-role
        vars:
          IAM_ROLE_NAME: $IAM_ROLE_NAME
      - task: aws-cli:attach-policy-to-role

  aws-resources-teardown:
    desc: Deletes the IAM role, IAM policy, and S3 bucket.
    internal: true
    cmds:
      - task: validate-prerequisites:awscli
      - task: aws-cli:detach-policy-from-role
      - task: aws-cli:delete-iam-role
      - task: aws-cli:delete-iam-policy
      - task: aws-cli:delete-s3-bucket
        vars:
          S3_BUCKET_NAME: $S3_BUCKET_NAME
          FORCE: --force

  snowflake-external-volume-up:
    desc: Validates Snowflake CLI, creates Snowflake external volume.
    internal: true
    cmds:
      - task: validate-prerequisites:snowcli
      - task: snow-cli:create-external-volume
      - task: snow-cli:desc-external-volume
        vars:
          EXTERNAL_VOLUME_NAME: $EXTERNAL_VOLUME_NAME

  snowflake-resources-teardown:
    desc: Drops the Snowflake external volume.
    internal: true
    cmds:
      - task: validate-prerequisites:snowcli
      - task: snow-cli:drop-database-if-exists
        vars:
          CLI_KEYPAIR_CONNECTION_NAME: $CLI_KEYPAIR_CONNECTION_NAME
          DEMO_DATABASE_NAME: $DEMO_DATABASE_NAME
      - task: snow-cli:drop-external-volume
        vars:
          EXTERNAL_VOLUME_NAME: $EXTERNAL_VOLUME_NAME

  demo-teardown:
    desc: Tears down AWS and Snowflake resources for Iceberg demo (routes by STORAGE_MODE).
    cmds:
      - task: demo-teardown-{{.STORAGE_MODE | default "managed"}}

  demo-teardown-external:
    desc: Tears down both Snowflake and AWS resources (external storage).
    internal: true
    cmds:
      - task: snowflake-resources-teardown
      - task: aws-resources-teardown

  demo-teardown-managed:
    desc: Tears down Snowflake resources only (managed storage, no AWS to clean up).
    internal: true
    cmds:
      - task: snowflake-resources-teardown-managed

  snowflake-resources-teardown-managed:
    desc: Drops Snowflake database only (no external volume in managed mode).
    internal: true
    cmds:
      - task: validate-prerequisites:snowcli
      - task: snow-cli:drop-database-if-exists
        vars:
          CLI_KEYPAIR_CONNECTION_NAME: $CLI_KEYPAIR_CONNECTION_NAME
          DEMO_DATABASE_NAME: $DEMO_DATABASE_NAME

  stream-telemetry:
    desc: Streams simulated vehicle telemetry into Iceberg V3 table via Snowpipe Streaming SDK.
    cmds:
      - task: snow-cli:stream-telemetry
        vars:
          EVENT_COUNT: '{{.EVENT_COUNT | default "100"}}'

  apply-network-policy:
    desc: Optional troubleshooting - creates an INGRESS network rule + policy for the streaming script. Run only if connections fail.
    cmds:
      - task: snow-cli:apply-network-policy

  spark-demo-up:
    desc: Sets up infrastructure, bootstraps a Spark venv, and launches the Jupyter interop notebook.
    cmds:
      - task: infrastructure-up
      - task: snow-cli:run-spark-jupyter

  spark-demo-teardown:
    desc: Tears down infrastructure (routes by STORAGE_MODE). The Spark venv is just a local directory.
    cmds:
      - task: demo-teardown
